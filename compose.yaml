services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas_store
      POSTGRES_USER: atlas_store
      POSTGRES_PASSWORD: atlas_store_dev
    ports:
      - "5432:5432"
    volumes:
      - atlas-store-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_store -d atlas_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atlas-store-postgres:
